name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Sign and release new versions
        env:
          VALENCE_PLUGIN_SIGNING_KEY: ${{ secrets.VALENCE_PLUGIN_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/releasePlugins.ts
      - name: Build and sign the catalogue
        env:
          VALENCE_PLUGIN_SIGNING_KEY: ${{ secrets.VALENCE_PLUGIN_SIGNING_KEY }}
        run: >-
          node .tools/valence-plugin.mjs catalogue packages
          --key-id valence-official-2026
          --package-url "https://github.com/${{ github.repository }}/releases/download/{id}-v{version}/{file}"
          --source-url "https://github.com/${{ github.repository }}/tree/main/plugins/{id}"
          --icon-url "https://valenceoss.github.io/valence-plugins/icons/{file}"
          --out site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
